<div class="usuario-menu">
  <button class="usuario-avatar-btn" (click)="alternar($event)" matTooltip="Menu do usuário">
    <span>{{ iniciaisUsuario }}</span>
  </button>

  <div class="usuario-dropdown" *ngIf="usuarioMenuAberto">
    <div class="usuario-header">
      <div class="usuario-avatar-grande">{{ iniciaisUsuario }}</div>
      <div class="usuario-identidade">
        <div class="usuario-nome">{{ nomeUsuario }}</div>
        <div class="usuario-meta">
          <span *ngIf="emailUsuario">{{ emailUsuario }}</span>
          <span class="usuario-papel">{{ papelUsuario }}</span>
        </div>
      </div>
    </div>

    <div class="usuario-opcoes">
      <button class="usuario-opcao" (click)="navegarParaProjetos()">
        <mat-icon>folder</mat-icon>
        <div>
          <strong>Meus Projetos</strong>
          <span>Pipelines salvos</span>
        </div>
      </button>
      <button class="usuario-opcao" (click)="navegarParaGaleria()">
        <mat-icon>explore</mat-icon>
        <div>
          <strong>Galeria</strong>
          <span>Pipelines compartilhados</span>
        </div>
      </button>
      <button class="usuario-opcao" (click)="navegarParaTurmas()">
        <mat-icon>groups</mat-icon>
        <div>
          <strong>Minhas turmas</strong>
          <span>Entrar e fazer atividades</span>
        </div>
      </button>
    </div>

    <div class="usuario-opcoes" *ngIf="usuarioProfessorOuAdmin">
      <button class="usuario-opcao" (click)="navegarGerenciarTurmas()">
        <mat-icon>school</mat-icon>
        <div>
          <strong>Gerenciar turmas</strong>
          <span>Turmas, atividades e ranking</span>
        </div>
      </button>
    </div>

    <div class="usuario-opcoes" *ngIf="usuarioAdmin">
      <button class="usuario-opcao" (click)="navegarParaAdmin()">
        <mat-icon>admin_panel_settings</mat-icon>
        <div>
          <strong>Painel admin</strong>
          <span>Gerenciar sistema</span>
        </div>
      </button>
      <button class="usuario-opcao" (click)="navegarParaUsuarios()">
        <mat-icon>people</mat-icon>
        <div>
          <strong>Usuários</strong>
          <span>Gerenciar contas</span>
        </div>
      </button>
    </div>

    <div class="usuario-opcoes">
      <button class="usuario-opcao" (click)="navegarParaSobre()">
        <mat-icon>info</mat-icon>
        <div>
          <strong>Sobre</strong>
          <span>O trabalho por trás da plataforma</span>
        </div>
      </button>
      <button class="usuario-opcao sair" (click)="sair()">
        <mat-icon>logout</mat-icon>
        <div>
          <strong>Sair</strong>
        </div>
      </button>
    </div>
  </div>
</div>

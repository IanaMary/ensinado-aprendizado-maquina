<div class="nomear-pipeline-dialog">
  <div class="dialog-header">
    <mat-icon>edit_note</mat-icon>
    <h2 mat-dialog-title>
      {{ data.isEdicao ? 'Renomear pipeline' : 'Salvar pipeline' }}
    </h2>
  </div>

  <mat-dialog-content>
    <p class="dialog-desc">
      Dê um nome para identificar este pipeline na sua galeria de projetos.
    </p>

    <div class="campo-form nome-field">
      <label class="campo-label">Nome do pipeline</label>
      <div class="campo-input-wrapper">
        <mat-icon class="campo-icon">label</mat-icon>
        <input
          class="campo-input"
          type="text"
          [(ngModel)]="nome"
          (keyup.enter)="confirmar()"
          maxlength="100"
          placeholder="Ex: Classificação Iris com KNN"
          autocomplete="off">
        <span class="campo-contador">{{ nome.length }}/100</span>
      </div>
    </div>

    <mat-checkbox *ngIf="data?.podePublicar" [(ngModel)]="publicar" class="publicar-check">
      Publicar na galeria (visível para os alunos)
    </mat-checkbox>

    <div class="erro" *ngIf="erro">
      <mat-icon>error_outline</mat-icon>
      <span>{{ erro }}</span>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button class="btn-cancelar" (click)="cancelar()">
      <mat-icon>close</mat-icon>
      Cancelar
    </button>
    <button mat-flat-button color="primary" class="btn-confirmar" (click)="confirmar()">
      <mat-icon>check</mat-icon>
      {{ data.isEdicao ? 'Renomear' : 'Salvar' }}
    </button>
  </mat-dialog-actions>
</div>

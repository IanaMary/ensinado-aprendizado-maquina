<div class="et-container">
  <div class="et-header">
    <button class="btn-voltar" (click)="voltar()"><mat-icon>arrow_back</mat-icon></button>
    <div class="header-info">
      <h2>Minhas turmas</h2>
      <p>Entre em uma turma com o código do professor e faça as atividades.</p>
    </div>
    <app-user-menu></app-user-menu>
  </div>

  <section class="card entrar-card">
    <h3><mat-icon>login</mat-icon> Entrar em uma turma</h3>
    <div class="entrar-row">
      <mat-form-field appearance="outline" class="campo">
        <mat-label>Código da turma</mat-label>
        <input matInput [(ngModel)]="codigo" (keyup.enter)="entrar()" maxlength="10" placeholder="Ex: ABC234" style="text-transform:uppercase">
      </mat-form-field>
      <button class="btn-primario" (click)="entrar()" [disabled]="entrando || !codigo.trim()">
        <mat-icon>arrow_forward</mat-icon> Entrar
      </button>
    </div>
  </section>

  <div *ngIf="carregando" class="vazio">Carregando…</div>
  <div *ngIf="!carregando && !turmas.length" class="vazio">Você ainda não está em nenhuma turma.</div>

  <section class="card turma" *ngFor="let t of turmas">
    <h3><mat-icon>groups</mat-icon> {{ t.nome }}</h3>
    <p *ngIf="t.descricao" class="desc">{{ t.descricao }}</p>
    <ul class="ativ-lista">
      <li *ngFor="let a of atividadesPorTurma[t.id]">
        <div class="ativ-info">
          <strong>{{ a.titulo }}</strong>
          <span *ngIf="a.descricao">{{ a.descricao }}</span>
        </div>
        <button class="btn-primario" (click)="fazerAtividade(t, a)">
          <mat-icon>play_arrow</mat-icon> Fazer
        </button>
      </li>
      <li *ngIf="!atividadesPorTurma[t.id]?.length" class="vazio">Nenhuma atividade nesta turma ainda.</li>
    </ul>
  </section>
</div>
